<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CQA Live</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#ffffff; --bg-2:#fafafa; --bg-3:#f2f2f2; --line:#ebebeb; --line-2:#e0e0e0;
  --ink:#0a0a0a; --ink-2:#4d4d4d; --ink-3:#8f8f8f; --ink-4:#c2c2c2;
  --yes:#16a34a; --yes-bg:#effbf3; --part:#d97706; --part-bg:#fff7eb; --no:#e5372b; --no-bg:#fff1f0;
  --na:#2563eb; --na-bg:#eff5ff; --gross:#9b1111; --gross-bg:#fdeceb;
  --mono:'Geist Mono',ui-monospace,Menlo,monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font:13.5px/1.5 Geist,Inter,system-ui,sans-serif;color:var(--ink);background:var(--bg);-webkit-font-smoothing:antialiased;overflow:hidden;font-feature-settings:"tnum"}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
kbd{font:500 10.5px/1 var(--mono);color:var(--ink-3);border:1px solid var(--line-2);border-radius:4px;padding:2px 5px;background:#fff}
.mono{font-family:var(--mono)}
:focus-visible{outline:2px solid #0a0a0a33;outline-offset:2px;border-radius:4px}
.app{display:grid;grid-template-rows:52px 1fr;height:100vh}
.top{display:flex;align-items:center;gap:14px;padding:0 20px;border-bottom:1px solid var(--line)}
.logo{display:flex;align-items:center;gap:10px;font-weight:600;letter-spacing:-.02em}
.logo svg{display:block}
.slash{color:var(--ink-4);font-size:20px;font-weight:300}
.crumb{display:flex;align-items:center;gap:8px;font-weight:500}
.crumb .tag{font:500 11px var(--mono);border:1px solid var(--line-2);border-radius:999px;padding:1px 7px;color:var(--ink-2)}
.run{display:flex;align-items:center;gap:10px;margin-left:12px;font:12px var(--mono);color:var(--ink-3)}
.run .pbar{width:160px;height:3px;background:var(--bg-3);border-radius:2px;overflow:hidden}
.run .pbar i{display:block;height:100%;width:0;background:var(--ink);transition:width .25s linear}
.run .st{display:flex;align-items:center;gap:6px;color:var(--ink)}
.pulse{width:7px;height:7px;border-radius:50%;background:var(--ink);animation:pl 1s ease infinite}
.pulse.done{background:var(--yes);animation:none}
@keyframes pl{50%{opacity:.25}}
.top-r{margin-left:auto;display:flex;align-items:center;gap:8px}
.btn{white-space:nowrap;height:32px;padding:0 12px;border:1px solid var(--line-2);border-radius:8px;display:inline-flex;align-items:center;gap:8px;font-weight:500;font-size:13px;background:#fff;transition:background .15s,border-color .15s}
.btn:hover{background:var(--bg-2);border-color:#cfcfcf}
.btn-pri{background:var(--ink);color:#fff;border-color:var(--ink)}
.btn-pri:hover{background:#2b2b2b;border-color:#2b2b2b}
.btn .k{display:flex;gap:2px}
.main{display:grid;grid-template-columns:272px 1fr 452px;min-height:0}
.col{min-height:0;overflow:auto}
.col+.col{border-left:1px solid var(--line)}

/* left rail */
.rail{padding:20px;display:flex;flex-direction:column;gap:22px;background:var(--bg-2)}
.blk h6{font:500 11px var(--mono);color:var(--ink-3);text-transform:uppercase;letter-spacing:.06em;margin-bottom:10px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 12px;font-size:12.5px}
.kv dt{color:var(--ink-3)}
.kv dd{text-align:right;font-family:var(--mono);font-size:12px}
.tl{position:relative;height:38px;margin-top:4px}
.tl .ax{position:absolute;left:0;right:0;top:14px;height:1px;background:var(--line-2)}
.tl .lim{position:absolute;top:6px;height:17px;border-right:1px dashed var(--no);}
.tl .lim span{position:absolute;right:-1px;top:-14px;transform:translateX(50%);font:10px var(--mono);color:var(--no);white-space:nowrap}
.tl .seg{position:absolute;top:11px;height:7px;background:var(--yes);border-radius:4px}
.tl .p{position:absolute;top:10px;width:9px;height:9px;border-radius:50%;background:#fff;border:2px solid var(--ink);transform:translateX(-50%)}
.tl .lb{position:absolute;top:24px;font:10px var(--mono);color:var(--ink-3);transform:translateX(-50%);white-space:nowrap}
.fact{font-size:12px;color:var(--ink-2);display:grid;grid-template-columns:16px 1fr;margin-top:8px;line-height:1.5}
.fact::before{content:"✓";color:var(--yes);font-weight:600}
.runs{display:flex;flex-direction:column;gap:6px}
.runrow{display:grid;grid-template-columns:52px 1fr 40px;align-items:center;gap:8px;font:12px var(--mono);color:var(--ink-3)}
.runrow .bars{display:flex;gap:2px}
.runrow .bars i{flex:1;height:14px;border-radius:2px;background:var(--bg-3);transition:background .2s}
.runrow b{text-align:right;color:var(--ink);font-weight:500}
.spark{display:flex;align-items:flex-end;gap:3px;height:56px;margin-top:4px}
.spark i{flex:1;background:var(--ink-4);border-radius:2px 2px 0 0;min-height:3px;position:relative}
.spark i.me{background:var(--ink)}
.spark-x{display:flex;justify-content:space-between;font:10px var(--mono);color:var(--ink-4);margin-top:4px}
.big2{display:flex;align-items:baseline;gap:8px;margin-top:12px}
.big2 b{font:600 22px var(--mono);letter-spacing:-.02em}
.big2 span{font-size:12px;color:var(--ink-3)}
.langs{display:flex;gap:6px;margin-top:10px}
.langs div{flex:1;border:1px solid var(--line);border-radius:8px;padding:6px 8px;background:#fff}
.langs span{font:10.5px var(--mono);color:var(--ink-3);display:block}
.langs b{font:500 14px var(--mono)}
.crit-avg{display:flex;flex-direction:column;gap:6px}
.crit-avg div{display:grid;grid-template-columns:92px 1fr 24px;align-items:center;gap:8px;font-size:12px;color:var(--ink-2)}
.crit-avg i{height:4px;background:var(--bg-3);border-radius:2px;overflow:hidden;display:block}
.crit-avg b{display:block;height:100%}
.crit-avg em{font:11px var(--mono);font-style:normal;text-align:right;color:var(--ink-3)}

/* transcript */
.tr-wrap{position:relative;background:#fff}
.tr-h{position:sticky;top:0;z-index:2;background:#fff;padding:14px 40px 12px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px}
.tr-h h2{font-size:14px;font-weight:600}
.tr-h .sub{font:12px var(--mono);color:var(--ink-3)}
.legend{margin-left:auto;display:flex;gap:12px;font-size:11.5px;color:var(--ink-3)}
.legend span{display:flex;gap:5px;align-items:center}
.legend i{width:8px;height:8px;border-radius:2px}
.turns{padding:16px 40px 360px;max-width:860px}
.turn{display:grid;grid-template-columns:34px 1fr;gap:12px;padding:10px 12px;border-radius:10px;position:relative;transition:opacity .35s,background .3s,box-shadow .3s}
.turn+.turn{margin-top:2px}
.t-i{font:500 11px/22px var(--mono);color:var(--ink-4);text-align:right;position:relative}
.t-h{display:flex;gap:8px;align-items:baseline;font-size:12px;color:var(--ink-3)}
.t-h b{font-weight:600;color:var(--ink);font-size:12.5px}
.t-h .mono{font-size:11px}
.t-x{font-size:14.5px;line-height:1.5;color:var(--ink);margin-top:2px;max-width:64ch}
.turn.bot .t-x{color:var(--ink-3);font-size:13px}
.turn.bot .t-h b{color:var(--ink-3);font-weight:500}
.turn.operator .t-h b{display:inline-flex;align-items:center;gap:6px}
.turn.operator .t-h b::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--ink)}
.turn.operator .t-h b{}
.turn.system{grid-template-columns:34px 1fr}
.turn.system .t-x{font:12px var(--mono);color:var(--ink-3);display:flex;align-items:center;gap:10px}
.turn.system .t-x::after{content:"";flex:1;height:1px;background:var(--line)}
.turns.reading .turn{opacity:.28}
.turns.reading .turn.read{opacity:1}
.turn.reading-now{background:var(--bg-2);box-shadow:inset 2px 0 0 var(--ink)}
.cites{position:absolute;right:10px;top:12px;display:flex;gap:3px}
.cites span{font:500 10px/1 var(--mono);padding:3px 5px;border-radius:4px;opacity:0;transform:scale(.6);transition:opacity .2s,transform .25s cubic-bezier(.3,1.6,.5,1)}
.cites span.on{opacity:1;transform:none}
.c-yes{background:var(--yes-bg);color:var(--yes)} .c-no{background:var(--no-bg);color:var(--no)} .c-part{background:var(--part-bg);color:var(--part)} .c-na{background:var(--na-bg);color:var(--na)} .c-gross{background:var(--gross);color:#fff} .c-ok{background:var(--bg-3);color:var(--ink-3)}
.turn.hit{animation:hit .9s ease}
.turn.hit-yes{--hc:22,163,74} .turn.hit-no{--hc:229,55,43} .turn.hit-part{--hc:217,119,6} .turn.hit-na{--hc:37,99,235} .turn.hit-gross{--hc:155,17,17} .turn.hit-ok{--hc:10,10,10}
@keyframes hit{0%{background:rgba(var(--hc),.0)}20%{background:rgba(var(--hc),.10);box-shadow:inset 2px 0 0 rgb(var(--hc))}100%{background:transparent}}
.turn.sel{background:var(--bg-2)}
.turn.sel .t-i{color:var(--ink)}
.turn.is-focus{animation:foc 1.4s ease}
@keyframes foc{0%{background:#fff4c2}100%{background:var(--bg-2)}}
mark{background:transparent;color:inherit;transition:background .3s;border-radius:3px;padding:0 1px}
.turn.sel mark,.turn.is-focus mark{background:#fff0a8}

/* scorecard */
.sc{display:flex;flex-direction:column;min-height:0;overflow:hidden}
.sc-h{padding:18px 22px 16px;border-bottom:1px solid var(--line);flex:none}
.sc-top{display:flex;align-items:flex-start;justify-content:space-between}
.total{font:600 52px/1 var(--mono);letter-spacing:-.05em}
.total small{font-size:16px;color:var(--ink-4);letter-spacing:0;font-weight:400;margin-left:4px}
.sc-meta{text-align:right;font:11.5px/1.6 var(--mono);color:var(--ink-3)}
.sc-meta b{color:var(--ink);font-weight:500}
.ticks{display:flex;gap:2px;height:18px;margin-top:14px}
.ticks i{flex:1;background:var(--bg-3);border-radius:1px;transition:background .1s}
.ticks i.on{background:var(--ink)}
.ticks i.mk{background:var(--ink-4)}
.ticks-x{display:flex;justify-content:space-between;font:10px var(--mono);color:var(--ink-4);margin-top:4px}
.gross-banner{margin-top:14px;display:flex;gap:10px;align-items:center;padding:10px 12px;border-radius:10px;background:var(--gross);color:#fff;font-size:12.5px;transform-origin:top;transition:opacity .3s,transform .3s cubic-bezier(.3,1.4,.5,1)}
.gross-banner.off{opacity:0;transform:scale(.96) translateY(-4px)}
.gross-banner b{font-weight:600}
.gross-banner .mono{white-space:nowrap;margin-left:auto;font-size:11px;opacity:.8}
.list{flex:none;padding:6px 10px}
.row{display:grid;grid-template-columns:18px 1fr 30px 64px 46px;align-items:center;gap:8px;padding:0 12px;height:40px;border-radius:8px;width:100%;text-align:left;transition:background .15s,opacity .3s}
.row:hover{background:var(--bg-2)}
.row.sel{background:var(--bg-3)}
.row.pending{opacity:.38}
.row.active{opacity:1;background:var(--bg-2)}
.st-ic{width:16px;height:16px;border-radius:50%;border:1.5px dashed var(--ink-4);display:grid;place-items:center;transition:.2s}
.row.active .st-ic{border:1.5px solid var(--ink);border-right-color:transparent;animation:spin .6s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.st-ic.s-yes{border:0;background:var(--yes)} .st-ic.s-no{border:0;background:var(--no)} .st-ic.s-part{border:0;background:conic-gradient(var(--part) 0 50%,var(--part-bg) 50% 100%);box-shadow:inset 0 0 0 1.5px var(--part)} .st-ic.s-na{border:1.5px solid var(--na);background:var(--na-bg)} .st-ic.s-gross{border:0;background:var(--gross)} .st-ic.s-ok{border:1.5px solid var(--ink-4)}
.st-ic svg{display:block}
.r-name{font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.r-name .w{font:11px var(--mono);color:var(--ink-4);margin-left:6px;font-weight:400}
.dots{display:flex;gap:3px}
.dots i{width:7px;height:7px;border-radius:50%;background:var(--bg-3);transition:background .15s,transform .2s}
.dots i.v{background:var(--ink)}
.dots i.x{background:#fff;box-shadow:inset 0 0 0 1.5px var(--part)}
.dots.rev i.v{background:var(--part)}
.verdict{white-space:nowrap;justify-self:start;font:500 12px var(--mono);padding:2px 7px;border-radius:5px;opacity:0;transform:translateY(3px);transition:.2s}
.verdict.on{opacity:1;transform:none}
.v-yes{background:var(--yes-bg);color:var(--yes)} .v-no{background:var(--no-bg);color:var(--no)} .v-part{background:var(--part-bg);color:var(--part)} .v-na{background:var(--na-bg);color:var(--na)} .v-gross{background:var(--gross);color:#fff} .v-ok{background:var(--bg-3);color:var(--ink-3)}
.r-pts{font:500 12.5px var(--mono);text-align:right}
.r-pts small{color:var(--ink-4);font-weight:400}
.detail{flex:1;min-height:0;overflow:auto;margin:6px 16px 16px;border:1px solid var(--line);border-radius:12px;padding:14px 16px;position:relative}
.d-h{display:flex;align-items:center;gap:8px;font:11px var(--mono);color:var(--ink-3);text-transform:uppercase;letter-spacing:.05em}
.d-h .live{display:flex;align-items:center;gap:6px;color:var(--ink)}
.d-h .r{margin-left:auto;text-transform:none;letter-spacing:0}
.d-t{font-weight:600;font-size:14px;margin-top:6px}
.d-x{margin-top:6px;color:var(--ink-2);line-height:1.55;font-size:13px;min-height:60px}
.caret{display:inline-block;width:7px;height:14px;background:var(--ink);vertical-align:-2px;margin-left:1px;animation:pl .8s step-end infinite}
.ref{font:500 10.5px/1 var(--mono);color:var(--ink);background:var(--bg-3);border-radius:4px;padding:2px 4px;vertical-align:1px;transition:background .12s}
.ref:hover{background:var(--ink);color:#fff}
.d-f{display:flex;gap:6px;align-items:center;margin-top:12px;flex-wrap:wrap}
.d-f .meta{font:11.5px var(--mono);color:var(--ink-3)}
.d-f .btn{height:28px;font-size:12.5px}
.d-f .sp{margin-left:auto}
.pop{position:absolute;left:12px;right:12px;bottom:12px;background:#fff;border:1px solid var(--line-2);border-radius:12px;box-shadow:0 16px 40px -12px rgba(0,0,0,.25);padding:14px;animation:up .18s ease}
@keyframes up{from{opacity:0;transform:translateY(6px)}}
.pop h5{font-size:13px;font-weight:600;display:flex;align-items:center}
.pop h5 button{margin-left:auto;color:var(--ink-3)}
.opts{display:flex;gap:4px;margin:10px 0;flex-wrap:wrap}
.opts button{height:28px;padding:0 10px;border-radius:7px;border:1px solid var(--line-2);font:500 12px var(--mono)}
.opts button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.pop textarea{width:100%;height:52px;border:1px solid var(--line-2);border-radius:8px;padding:7px 9px;font:13px/1.4 Geist;resize:none}
.pop textarea:focus{outline:0;border-color:var(--ink)}
.pop .f{display:flex;align-items:center;gap:8px;margin-top:8px}
.pop .f .delta{margin-left:auto;font:12px var(--mono);color:var(--ink-3)}
.trail{display:flex;align-items:center;gap:8px;margin-top:12px;font:12px var(--mono)}
.trail span{padding:4px 8px;border-radius:6px;border:1px solid var(--line)}
.trail span.f{background:var(--ink);color:#fff;border-color:var(--ink)}
.trail em{color:var(--ink-4);font-style:normal}

/* cmdk */
.cmdk-overlay{position:fixed;inset:0;background:rgba(255,255,255,.55);backdrop-filter:blur(2px);display:flex;justify-content:center;padding-top:14vh;z-index:50;opacity:0;transition:opacity .14s}
.cmdk-overlay.is-open{opacity:1}
.cmdk{width:640px;max-height:460px;background:#fff;border-radius:12px;border:1px solid var(--line-2);box-shadow:0 24px 60px -12px rgba(0,0,0,.22);display:flex;flex-direction:column;overflow:hidden;transform:scale(.98);transition:transform .14s}
.is-open .cmdk{transform:none}
.cmdk-input{display:flex;align-items:center;gap:10px;padding:0 16px;height:52px;border-bottom:1px solid var(--line);color:var(--ink-3)}
.cmdk-input input{flex:1;border:0;outline:0;font:15px Geist;color:var(--ink)}
.cmdk-list{overflow:auto;padding:6px}
.cmdk-group{font:500 11px var(--mono);color:var(--ink-3);padding:10px 10px 4px;text-transform:uppercase;letter-spacing:.06em}
.cmdk-item{display:flex;align-items:center;gap:10px;height:38px;padding:0 10px;border-radius:8px;color:var(--ink-2);cursor:pointer}
.cmdk-item.is-sel{background:var(--bg-3);color:var(--ink)}
.cmdk-t{flex:1;display:flex;gap:8px;align-items:center;min-width:0;white-space:nowrap}
.cmdk-sub{color:var(--ink-3);overflow:hidden;text-overflow:ellipsis}
.cmdk-lang{font:500 10px var(--mono);color:var(--ink-3);border:1px solid var(--line-2);border-radius:4px;padding:1px 4px}
.cmdk-hint{font:11.5px var(--mono);color:var(--ink-3)}
.cmdk-foot{display:flex;gap:16px;padding:9px 16px;border-top:1px solid var(--line);font-size:12px;color:var(--ink-3);background:var(--bg-2)}
.cmdk-foot span{display:flex;gap:4px;align-items:center}
.cmdk-foot-r{margin-left:auto;font-family:var(--mono);font-size:11px}
.cmdk-empty{padding:28px;text-align:center;color:var(--ink-3)}
.toast{position:fixed;bottom:24px;left:50%;transform:translate(-50%,8px);background:var(--ink);color:#fff;padding:9px 16px;border-radius:10px;font-size:13px;opacity:0;transition:.18s;pointer-events:none;z-index:60}
.toast.is-on{opacity:1;transform:translate(-50%,0)}
::-webkit-scrollbar{width:8px}::-webkit-scrollbar-thumb{background:#e6e6e6;border-radius:8px;border:2px solid #fff}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="logo"><svg width="20" height="20" viewBox="0 0 20 20"><path d="M10 2l8 15H2z" fill="#0a0a0a"/></svg>CQA</div>
    <span class="slash">/</span>
    <div class="crumb"><span class="mono" id="cid"></span><span class="tag" id="clang"></span></div>
    <div class="run"><span class="st" id="rst"><i class="pulse"></i><span>читаю диалог</span></span><span class="pbar"><i id="pb"></i></span><span id="rmeta"></span></div>
    <div class="top-r">
      <button class="btn" data-cmdk>Команды <span class="k"><kbd>⌘</kbd><kbd>K</kbd></span></button>
      <button class="btn btn-pri" id="replay">▶ Пересмотреть оценку</button>
    </div>
  </header>
  <main class="main">
    <aside class="col rail" id="rail"></aside>
    <section class="col tr-wrap" id="trw">
      <div class="tr-h"><h2>Расшифровка</h2><span class="sub" id="trsub"></span>
        <div class="legend"><span><i style="background:var(--yes)"></i>да</span><span><i style="background:var(--part)"></i>частично</span><span><i style="background:var(--no)"></i>нет</span><span><i style="background:var(--na)"></i>N/A</span><span><i style="background:var(--gross)"></i>грубая</span></div></div>
      <div class="turns" id="turns"></div>
    </section>
    <section class="col sc">
      <div class="sc-h">
        <div class="sc-top"><div class="total" id="total">0,00<small>/100</small></div>
          <div class="sc-meta" id="scmeta"></div></div>
        <div class="ticks" id="ticks"></div>
        <div class="ticks-x"><span>0</span><span>среднее ${avg}</span><span>100</span></div>
        <div class="gross-banner off" id="gb"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="#fff" stroke-width="1.6"><path d="M8 1.8l6.5 11.4h-13z"/><path d="M8 6.2v3.2M8 11.4v.1"/></svg><span><b>Грубая ошибка.</b> Раскрытие данных счёта без идентификации</span><span class="mono" id="gbv"></span></div>
      </div>
      <div class="list" id="list"></div>
      <div class="detail" id="detail"></div>
    </section>
  </main>

<script>

function buildPalette() {

  </div>`;

    });

    const s = $('.is-sel', list); s && s.scrollIntoView({ block: 'nearest' });

}
/* approximate new total if reviewer changes c (no NA re-weighting for simplicity unless na) */
function totalWith(c, v) {

    <div class="big2"><b>${Math.round(DATA.agreement*100)}%</b><span>ответов — согласие 3/3</span></div>
    <div class="langs">${['RU','KZ','EN'].map(l => `<div><span>${l}</span><b>${fmt(L[l],1)}</b></div>`).join('')}</div></div>
  <div class="blk"><h6>Критерии · средний балл</h6><div class="crit-avg">${Object.entries(DATA.stats.criteria).map(([id, v]) => `<div><span>${SHORT[id]}</span><i><b style="width:${v.avg_ratio*100}%;background:${v.avg_ratio < .5 ? 'var(--no)' : v.avg_ratio < .8 ? 'var(--part)' : 'var(--ink)'}"></b></i><em>${Math.round(v.avg_ratio*100)}</em></div>`).join('')}</div></div>`;
})();
$('.ticks-x span:nth-child(2)').textContent = 'среднее ' + fmt(DATA.stats.avg_total, 1);

/* transcript */
$('#turns').innerHTML = T.map((t, i) => `<div class="turn ${t.speaker}" data-tidx="${i}"><div class="t-i">${i}</div><div>
  ${t.speaker === 'system' ? `<div class="t-x">${esc(t.text)} · ${t.timestamp}</div>` : `<div class="t-h"><b>${SPEAKER[t.speaker]}</b><span class="mono">${t.timestamp}</span></div><div class="t-x">${turnHTML(i)}</div>`}</div>
  <div class="cites">${(CITED[i]||[]).map(c => `<span class="c-${c.status}" data-c="${c.id}">${c.i}</span>`).join('')}</div></div>`).join('');

/* ticks */
$('#ticks').innerHTML = Array.from({ length: 50 }, (_, i) => `<i data-t="${i}"></i>`).join('');
function setTotal(v){
  $('#total').innerHTML = `${fmt(v)}<small>/100</small>`;
  const n = Math.round(v / 2), avg = Math.round(DATA.stats.avg_total / 2);
  $$('#ticks i').forEach((t, i) => { t.className = i < n ? 'on' : i === avg ? 'mk' : ''; });
}
$('#scmeta').innerHTML = `<b>${EV.model}</b><br>×${EV.samples} прогона · <span id="lat">—</span>`;

/* rows */
const svgCheck = '<svg width="10" height="10" viewBox="0 0 10 10" fill="none" stroke="#fff" stroke-width="1.8"><path d="M2 5.2l2 2 4-4.4"/></svg>';
const svgX = '<svg width="10" height="10" viewBox="0 0 10 10" fill="none" stroke="#fff" stroke-width="1.8"><path d="M2.5 2.5l5 5M7.5 2.5l-5 5"/></svg>';
const icFor = s => s === 'yes' ? svgCheck : (s === 'no' || s === 'gross') ? svgX : '';
$('#list').innerHTML = CRITS.map(c => `<button class="row pending" data-id="${c.id}">
  <span class="st-ic"></span><span class="r-name">${c.name}${c.weight ? `<span class="w">${c.weight}</span>` : ''}</span>
  <span class="dots${c.review ? ' rev' : ''}">${c.votes.map(() => '<i></i>').join('')}</span>
  <span class="verdict v-${c.status}">${c.label.replace(/ /g, '')}</span>
  <span class="r-pts">—</span></button>`).join('');

let selId = null, popFor = null, draft = { v: null, r: '' };
const decisions = {};
function rowDone(c){
  const r = $(`.row[data-id="${c.id}"]`); r.classList.remove('pending', 'active');
  const ic = $('.st-ic', r); ic.className = 'st-ic s-' + c.status; ic.innerHTML = icFor(c.status);
  const fin = c.a.na ? 'N/A' : c.a.value;
  $$('.dots i', r).forEach((d, k) => d.className = c.votes[k] === fin ? 'v' : 'x');
  $('.verdict', r).classList.add('on');
  $('.r-pts', r).innerHTML = c.type === 'flag' ? '<small>флаг</small>' : c.a.na ? '<small>N/A</small>' : `${fmtPts(c.pts)}<small>/${fmtPts(c.eff)}</small>`;
  $$(`.cites span[data-c="${c.id}"]`).forEach(s => s.classList.add('on'));
  [0,1,2].forEach(k => { const b = $(`.bars i[data-run="${k}"][data-c="${c.id}"]`); const v = c.votes[k];
    b.style.background = v === 'N/A' ? 'var(--na)' : c.type === 'flag' ? (v ? 'var(--gross)' : 'var(--ink-4)') : (v === (c.type === 'binary' ? 1 : c.scale.max) ? 'var(--yes)' : v === 0 ? 'var(--no)' : 'var(--part)'); });
}
function detail(c, typing){
  const cr = c.a.checked_range;
  const dec = decisions[c.id];
  const head = typing ? `<span class="live"><i class="pulse"></i>оценивается</span>` : `<span>Критерий ${c.i} из 8</span>`;
  $('#detail').innerHTML = `<div class="d-h">${head}<span class="r">${c.agree}/3 согласие${c.review ? ' · <b style="color:var(--part)">проверить</b>' : ''}</span></div>
    <div class="d-t">${c.name}</div><div class="d-x" id="dx"></div>
    <div class="d-f" id="df" style="${typing ? 'visibility:hidden' : ''}"><span class="meta">проверено [${cr.from_turn}–${cr.to_turn}] · голоса ${c.votes.map(v => voteLabel(v, c)).join('/')}</span>
      <span class="sp"></span>${dec ? '' : `<button class="btn" data-act="appeal">Оспорить</button>`}</div>
    ${dec ? trail(c, dec) : ''}${popFor === c.id ? pop(c) : ''}`;
  const txt = c.a.explanation + (c.a.na_reason ? ' N/A: ' + c.a.na_reason : '');
  if (!typing) { $('#dx').innerHTML = linkRefs(txt); return Promise.resolve(); }
  return new Promise(res => { let k = 0; const step = Math.max(2, Math.ceil(txt.length / 28));
    const h = setInterval(() => { k += step; $('#dx').innerHTML = linkRefs(txt.slice(0, k).replace(/\[\d*$/, '')) + '<span class="caret"></span>';
      if (k >= txt.length) { clearInterval(h); $('#dx').innerHTML = linkRefs(txt); $('#df').style.visibility = ''; res(); } }, 16); timers.push(h); });
}
function pop(c){ return `<div class="pop"><h5>Оспорить: ${c.short}<button data-act="close">✕</button></h5>
  <div class="opts">${decisionOptions(c).map(o => `<button data-v="${o.v}" class="${String(draft.v) === String(o.v) ? 'on' : ''}">${o.l}</button>`).join('')}</div>
  <textarea placeholder="Комментарий для апелляции">${esc(draft.r)}</textarea>
  <div class="f"><button class="btn btn-pri" data-act="save">Отправить</button><span class="delta">${draft.v != null ? `${fmt(TOTAL)} → <b style="color:var(--ink)">${fmt(totalWith(c, draft.v === 'na' ? 'na' : +draft.v))}</b>` : ''}</span></div></div>`; }
function trail(c, d){ const l = d.v === 'na' ? 'N/A' : voteLabel(+d.v, c);
  return `<div class="trail"><span>ИИ ${c.label}</span><em>→</em><span>ревьюер ${l}</span><em>→</em><span class="f">итог ${fmt(totalWith(c, d.v === 'na' ? 'na' : +d.v))}</span></div>`; }

function select(id){
  selId = id; const c = CRITS.find(x => x.id === id);
  $$('.row').forEach(r => r.classList.toggle('sel', r.dataset.id === id));
  $$('.turn').forEach(t => t.classList.toggle('sel', c.a.evidence.some(e => e.turn === +t.dataset.tidx)));
  detail(c, false);
}
$('#list').addEventListener('click', e => { const r = e.target.closest('.row'); if (!r || running) return; popFor = null; select(r.dataset.id); focusTurn(CRITS.find(c => c.id === r.dataset.id).a.evidence[0].turn); });
$('#detail').addEventListener('click', e => {
  const act = e.target.closest('[data-act]')?.dataset.act, opt = e.target.closest('.opts button'); if (!selId) return; const c = CRITS.find(x => x.id === selId);
  if (opt) { draft.r = $('.pop textarea').value; draft.v = opt.dataset.v; detail(c, false); return; }
  if (act === 'appeal') { popFor = c.id; draft = { v: null, r: '' }; detail(c, false); setTimeout(() => $('.pop textarea')?.focus(), 0); }
  if (act === 'close') { popFor = null; detail(c, false); }
  if (act === 'save') { if (draft.v == null) return toast('Выберите решение'); decisions[c.id] = { ...draft }; popFor = null; detail(c, false); const r = $(`.row[data-id="${c.id}"] .verdict`); r.className = 'verdict on v-part'; r.textContent = 'изменено'; toast('Апелляция отправлена'); }
});

/* ---------- live evaluation sequence ---------- */
let timers = [], running = false;
const wait = ms => new Promise(r => { const h = setTimeout(r, ms); timers.push(h); });
function reset(){
  timers.forEach(h => { clearTimeout(h); clearInterval(h); }); timers = [];
  $$('.row').forEach(r => { r.className = 'row pending'; $('.st-ic', r).className = 'st-ic'; $('.st-ic', r).innerHTML = ''; $$('.dots i', r).forEach(d => d.className = ''); $('.verdict', r).classList.remove('on'); $('.r-pts', r).textContent = '—'; });
  $$('.cites span').forEach(s => s.classList.remove('on')); $$('.bars i').forEach(b => b.style.background = '');
  $$('.turn').forEach(t => t.classList.remove('read', 'sel', 'reading-now', 'hit'));
  $('#gb').classList.add('off'); setTotal(0); $('#lat').textContent = '—'; [0,1,2].forEach(k => $('#rt'+k).textContent = '—');
  $('#detail').innerHTML = `<div class="d-h"><span class="live"><i class="pulse"></i>чтение</span></div><div class="d-x" style="color:var(--ink-3)">Модель читает ${T.length} реплик и сверяет их с чек-листом «${esc(CL.name)}» v${CL.version}…</div>`;
}
function status(txt, done){ $('#rst').innerHTML = `<i class="pulse${done ? ' done' : ''}"></i><span>${txt}</span>`; }
function animateTotal(to, ms){ const from = parseFloat($('#total').textContent.replace(',', '.')) || 0; const t0 = performance.now();
  return new Promise(res => { (function f(now){ const p = Math.min(1, (now - t0) / ms), e = 1 - Math.pow(1 - p, 3); setTotal(from + (to - from) * e); p < 1 ? requestAnimationFrame(f) : res(); })(t0); }); }
async function play(){
  reset(); running = true; selId = null; popFor = null;
  const tw = $('#turns'), sc = $('#trw'); tw.classList.add('reading'); sc.scrollTop = 0;
  const totalSteps = T.length + CRITS.length * 3; let step = 0; const prog = () => $('#pb').style.width = (++step / totalSteps * 100) + '%';
  $('#pb').style.width = '0%'; status('читаю диалог'); $('#rmeta').textContent = '';
  for (let i = 0; i < T.length; i++) {
    const el = $(`[data-tidx="${i}"]`); $$('.reading-now').forEach(x => x.classList.remove('reading-now'));
    el.classList.add('read', 'reading-now'); if (el.offsetTop > sc.scrollTop + sc.clientHeight - 160) sc.scrollTop = el.offsetTop - 220; prog(); await wait(95);
  }
  $$('.reading-now').forEach(x => x.classList.remove('reading-now')); tw.classList.remove('reading');
  let acc = 0;
  for (const c of CRITS) {
    status(`критерий ${c.i}/8 · ${c.short.toLowerCase()}`);
    const r = $(`.row[data-id="${c.id}"]`); r.classList.remove('pending'); r.classList.add('active');
    $$('.row').forEach(x => x.classList.toggle('sel', false));
    const typing = detail(c, true);
    for (const e of c.a.evidence) { const t = $(`[data-tidx="${e.turn}"]`); t.classList.remove('hit'); void t.offsetWidth; t.className = t.className.replace(/hit-\w+/g, ''); t.classList.add('hit', 'hit-' + c.status);
      if (t.offsetTop < sc.scrollTop + 60 || t.offsetTop > sc.scrollTop + sc.clientHeight - 120) sc.scrollTo({ top: t.offsetTop - 200, behavior: 'smooth' }); }
    const fin = c.a.na ? 'N/A' : c.a.value;
    for (let k = 0; k < 3; k++) { await wait(170); const d = $$('.dots i', r)[k]; d.className = c.votes[k] === fin ? 'v' : 'x'; $('#rt' + k).textContent = (CRITS.indexOf(c) + 1) + '/8'; prog(); }
    await typing; rowDone(c); acc += c.pts; animateTotal(acc, 380); await wait(260);
  }
  await animateTotal(TOTAL, 300);
  [0,1,2].forEach(k => $('#rt'+k).textContent = '✓');
  if (GROSS) { $('#gb').classList.remove('off'); $('#gbv').textContent = CRITS.find(c => c.id === 'gross_errors').agree + '/3 прогона'; }
  $('#lat').textContent = fmt(EV.latency_s, 1) + ' с · $' + EV.cost_usd.toFixed(3);
  status('оценка готова', true); $('#rmeta').textContent = `${fmt(EV.latency_s,1)} с · ${REVIEW_N} без консенсуса`; $('#pb').style.width = '100%';
  running = false; select('identification');
}
function renderStatic(){
  reset(); $('#turns').classList.remove('reading'); $$('.turn').forEach(t => t.classList.add('read'));
  CRITS.forEach(rowDone); setTotal(TOTAL); [0,1,2].forEach(k => $('#rt'+k).textContent = '✓');
  if (GROSS) { $('#gb').classList.remove('off'); $('#gbv').textContent = CRITS.find(c => c.id === 'gross_errors').agree + '/3 прогона'; }
  $('#lat').textContent = fmt(EV.latency_s, 1) + ' с · $' + EV.cost_usd.toFixed(3);
  status('оценка готова', true); $('#rmeta').textContent = `${fmt(EV.latency_s,1)} с · ${REVIEW_N} без консенсуса`; $('#pb').style.width = '100%';
  select('identification'); const sc = $('#trw'); sc.scrollTop = $('[data-tidx="7"]').offsetTop - 60;
}
$('#replay').onclick = () => play();
buildPalette();
const qp = new URLSearchParams(location.search);
if (isStatic) { renderStatic(); if (qp.has('appeal')) { popFor = 'closing'; draft = { v: '0', r: 'Итог не подведён, причина ограничения не названа [15]' }; select('closing'); } }
else if (qp.has('mid')) { play(); }
else play();
</script>
</body>
</html>
