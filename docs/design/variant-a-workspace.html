<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CQA Workspace</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;450;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#ffffff; --bg-2:#fafafa; --bg-3:#f4f4f5; --line:#ececee; --line-2:#e2e2e6;
  --ink:#16161a; --ink-2:#4a4a55; --ink-3:#86868f; --ink-4:#b4b4bc;
  --acc:#0b7d4b; --acc-2:#e7f5ee; --acc-ring:rgba(11,125,75,.22);
  --yes:#15803d; --yes-bg:#ecfdf3; --part:#b45309; --part-bg:#fff7e6; --no:#dc2626; --no-bg:#fef1f1;
  --na:#2563eb; --na-bg:#eef4ff; --gross:#8f1414; --gross-bg:#fbe9e9;
  --mono:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
  --r:6px; --sh:0 1px 2px rgba(16,16,24,.04),0 0 0 1px var(--line);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font:13px/1.45 Inter,system-ui,sans-serif;color:var(--ink);background:var(--bg);font-feature-settings:"cv11","ss01","tnum";-webkit-font-smoothing:antialiased;overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
kbd{font:500 10.5px/1 var(--mono);color:var(--ink-3);background:var(--bg);border:1px solid var(--line-2);border-bottom-width:2px;border-radius:4px;padding:2px 5px;min-width:18px;display:inline-flex;justify-content:center}
.mono{font-family:var(--mono)}
.ico{flex:none}
:focus-visible{outline:2px solid var(--acc-ring);outline-offset:1px;border-radius:4px}

/* layout */
.app{display:grid;grid-template-rows:48px 1fr 28px;height:100vh}
.top{display:flex;align-items:center;gap:12px;padding:0 16px;border-bottom:1px solid var(--line)}
.logo{display:flex;align-items:center;gap:8px;font-weight:600;letter-spacing:-.01em}
.logo-mark{width:22px;height:22px;border-radius:6px;background:var(--acc);display:grid;place-items:center;color:#fff;font:700 10px/1 var(--mono)}
.crumbs{display:flex;align-items:center;gap:6px;color:var(--ink-3)}
.crumbs b{color:var(--ink);font-weight:500}
.crumbs .sep{color:var(--ink-4)}
.top-r{margin-left:auto;display:flex;align-items:center;gap:8px}
.search-btn{display:flex;align-items:center;gap:8px;height:30px;padding:0 6px 0 10px;width:280px;border:1px solid var(--line-2);border-radius:7px;color:var(--ink-3);transition:border-color .15s,box-shadow .15s}
.search-btn:hover{border-color:#d0d0d6;box-shadow:0 1px 2px rgba(0,0,0,.04)}
.search-btn span{flex:1;text-align:left}
.btn{white-space:nowrap;height:30px;padding:0 12px;border-radius:7px;display:inline-flex;align-items:center;gap:6px;font-weight:500;border:1px solid var(--line-2);background:#fff;transition:background .15s,border-color .15s}
.btn:hover{background:var(--bg-2)}
.btn-pri{background:var(--acc);border-color:var(--acc);color:#fff}
.btn-pri:hover{background:#086a3f}
.avatar{width:28px;height:28px;border-radius:50%;background:linear-gradient(135deg,#d9f2e5,#b7e0cc);color:var(--acc);display:grid;place-items:center;font-weight:600;font-size:11px}

.main{display:grid;grid-template-columns:316px 1fr 468px;min-height:0}
.pane{min-height:0;display:flex;flex-direction:column}
.pane+.pane{border-left:1px solid var(--line)}
.pane-h{height:44px;flex:none;display:flex;align-items:center;gap:8px;padding:0 16px;border-bottom:1px solid var(--line)}
.pane-h h2{font-size:13px;font-weight:600}
.count{font:500 11px/1 var(--mono);color:var(--ink-3)}

/* queue */
.seg{display:flex;gap:2px;margin-left:auto;background:var(--bg-3);padding:2px;border-radius:7px}
.seg button{height:22px;padding:0 8px;border-radius:5px;font-size:12px;color:var(--ink-3);display:flex;align-items:center;gap:5px}
.seg button.on{background:#fff;color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.seg .n{font:500 10.5px var(--mono);color:var(--ink-4)}
.queue{flex:1;overflow:auto;padding:6px}
.q{display:block;width:100%;text-align:left;padding:9px 10px 10px;border-radius:7px;position:relative;transition:background .12s}
.q:hover{background:var(--bg-2)}
.q.on{background:var(--bg-3)}
.q.on::before{content:"";position:absolute;left:-6px;top:10px;bottom:10px;width:2px;border-radius:2px;background:var(--acc)}
.q-1{display:flex;align-items:center;gap:6px}
.q-id{font:500 12px var(--mono)}
.lang{font:600 9.5px/1 var(--mono);letter-spacing:.04em;color:var(--ink-3);border:1px solid var(--line-2);border-radius:4px;padding:2px 4px}
.q-score{margin-left:auto;font:500 12px var(--mono);display:flex;align-items:center;gap:6px}
.q-prev{color:var(--ink-3);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin:3px 0 7px}
.q-marks{display:flex;gap:3px;align-items:center}
.q-marks i{width:14px;height:4px;border-radius:2px}
.q-tag{margin-left:auto;font-size:10.5px;color:var(--part);display:flex;gap:4px;align-items:center}
.q-tag.g{color:var(--gross)}
.m-yes{background:var(--yes)} .m-part{background:#e59a2b} .m-no{background:var(--no)} .m-na{background:#8fb1f5} .m-crit{background:var(--gross)} .m-ok{background:var(--line-2)}
.dot{width:7px;height:7px;border-radius:50%;display:inline-block}

.heat{flex:none;border-top:1px solid var(--line);padding:12px 16px 14px}
.heat-h{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:8px}
.heat-h b{font-size:12px;font-weight:600}
.heat-h span{font-size:11px;color:var(--ink-3)}
.heat table{width:100%;border-collapse:separate;border-spacing:3px}
.heat th{font:500 10.5px var(--mono);color:var(--ink-3);text-align:center}
.heat td{height:19px;border-radius:4px;text-align:center;font:500 10.5px var(--mono)}
.heat td.l{text-align:left;font:12px Inter;color:var(--ink-2);padding-right:4px;width:110px}

/* transcript */
.dlg-h{padding:14px 24px 12px;border-bottom:1px solid var(--line);flex:none}
.dlg-title{display:flex;align-items:center;gap:10px}
.dlg-title h1{font:600 16px/1.2 Inter;letter-spacing:-.015em}
.dlg-title .mono{font-size:15px}
.meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.chip{display:inline-flex;align-items:center;gap:6px;height:22px;padding:0 8px;border-radius:6px;border:1px solid var(--line);font-size:12px;color:var(--ink-2);background:#fff}
.chip.ok{color:var(--yes);border-color:#cdebd8;background:var(--yes-bg)}
.chip .mono{font-size:11px}
.dlg-nav{margin-left:auto;display:flex;gap:4px;align-items:center;color:var(--ink-3);font-size:12px}
.transcript{position:relative;flex:1;overflow:auto;padding:8px 0 200px;scroll-behavior:smooth}
.turn{display:grid;grid-template-columns:52px 92px 1fr auto;gap:0 8px;padding:7px 24px 7px 0;align-items:start;position:relative;transition:background .2s}
.turn:hover{background:var(--bg-2)}
.t-idx{font:500 11px/20px var(--mono);color:var(--ink-4);text-align:right}
.t-who{font-size:12px;line-height:20px;color:var(--ink-3);display:flex;flex-direction:column}
.t-who time{font:11px/16px var(--mono);color:var(--ink-4)}
.t-text{line-height:20px;color:var(--ink-2);max-width:62ch}
.turn.op .t-who b{color:var(--acc);font-weight:600}
.turn.op .t-text{color:var(--ink)}
.turn.cl .t-who b{color:var(--ink);font-weight:600}
.turn.cl .t-text{color:var(--ink)}
.turn.bot .t-text{color:var(--ink-3);display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden}
.turn.bot:hover .t-text{-webkit-line-clamp:unset}
.turn.bot{padding-top:4px;padding-bottom:4px}
.turn.bot .t-who{flex-direction:row;gap:8px}
.turn.bot .t-who b{font-weight:500}
.turn.sys{grid-template-columns:52px 1fr;padding:10px 24px 10px 0}
.sys-line{display:flex;align-items:center;gap:10px;color:var(--ink-3);font-size:12px}
.sys-line::before,.sys-line::after{content:"";height:1px;flex:1;background:var(--line)}
.t-cites{display:flex;gap:3px;padding-top:4px}
.t-cites i{width:6px;height:6px;border-radius:50%}
mark{background:transparent;color:inherit;padding:0 1px;border-bottom:1.5px solid transparent;transition:border-color .2s}
.turn.cited-sel mark{border-bottom-color:#e9b949}
.turn.cited-sel{background:linear-gradient(90deg,var(--acc-2),rgba(231,245,238,.35))}
.turn.cited-sel .t-idx{color:var(--acc)}
.turn.is-focus{animation:flash 1.6s ease}
@keyframes flash{0%{background:#fff3c4}100%{background:transparent}}
.turn.cited-sel.is-focus{animation:flash2 1.6s ease}
@keyframes flash2{0%{background:#fff3c4}100%{background:var(--acc-2)}}
.turn.is-focus .t-idx::after{content:"";position:absolute;left:0;top:6px;bottom:6px;width:3px;background:var(--acc);border-radius:0 2px 2px 0}
.op-gap{display:flex;align-items:center;gap:8px;padding:2px 24px 2px 62px;color:var(--yes);font-size:11.5px}
.op-gap .bar{height:4px;width:120px;background:var(--bg-3);border-radius:2px;overflow:hidden}
.op-gap .bar i{display:block;height:100%;background:var(--yes)}

/* scorecard */
.score-h{padding:16px 20px 14px;border-bottom:1px solid var(--line);flex:none}
.score-row{display:flex;align-items:flex-end;gap:14px}
.score{font:600 40px/1 Inter;letter-spacing:-.035em;font-variant-numeric:tabular-nums}
.score small{font-size:15px;color:var(--ink-4);font-weight:500;letter-spacing:0;margin-left:2px}
.flags{display:flex;flex-direction:column;gap:5px;padding-bottom:3px}
.flag{display:inline-flex;align-items:center;gap:6px;height:22px;padding:0 8px;border-radius:6px;font-size:12px;font-weight:500;width:max-content}
.flag.gross{background:var(--gross);color:#fff}
.flag.rev{background:var(--part-bg);color:var(--part)}
.score-r{margin-left:auto;text-align:right;font-size:11.5px;color:var(--ink-3);line-height:1.6}
.score-r .mono{color:var(--ink-2)}
.secs{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:14px}
.sec{min-width:0}
.sec span{display:block;font-size:11px;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sec b{font:500 12px var(--mono)}
.sec .bar{height:3px;border-radius:2px;background:var(--bg-3);margin-top:5px;overflow:hidden}
.sec .bar i{display:block;height:100%}
.crits{flex:1;overflow:auto;padding:6px 8px 12px}
.crit{border-radius:8px;transition:background .12s,box-shadow .15s}
.crit-row{display:grid;grid-template-columns:22px 1fr auto 74px 48px;align-items:center;gap:8px;width:100%;text-align:left;padding:8px 10px;border-radius:8px}
.crit:not(.open) .crit-row:hover{background:var(--bg-2)}
.crit.sel:not(.open) .crit-row{background:var(--bg-3)}
.crit.open{box-shadow:0 0 0 1px var(--line-2),0 4px 16px -6px rgba(16,16,24,.1);background:#fff;margin:4px 0}
.c-n{font:500 11px var(--mono);color:var(--ink-4)}
.c-name{font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.c-w{font:11px var(--mono);color:var(--ink-4);margin-left:6px}
.votes{display:flex;gap:3px}
.votes i{width:6px;height:6px;border-radius:50%;background:var(--ink-2)}
.votes i.x{background:transparent;box-shadow:inset 0 0 0 1.5px var(--part)}
.votes.rev i:not(.x){background:var(--part)}
.pill{justify-self:start;display:inline-flex;align-items:center;gap:5px;height:20px;padding:0 7px;border-radius:5px;font-size:11.5px;font-weight:500;white-space:nowrap}
.p-yes{background:var(--yes-bg);color:var(--yes)} .p-no{background:var(--no-bg);color:var(--no)} .p-part{background:var(--part-bg);color:var(--part)} .p-na{background:var(--na-bg);color:var(--na)} .p-gross{background:var(--gross);color:#fff} .p-ok{background:var(--bg-3);color:var(--ink-3)}
.c-pts{font:500 12px var(--mono);text-align:right;color:var(--ink-2)}
.c-pts small{color:var(--ink-4);font-size:10.5px}
.c-body{padding:2px 14px 14px 40px;display:none}
.crit.open .c-body{display:block;animation:in .18s ease}
@keyframes in{from{opacity:0;transform:translateY(-3px)}}
.c-exp{color:var(--ink-2);line-height:1.55}
.ref{font:500 10.5px/1 var(--mono);color:var(--acc);background:var(--acc-2);border-radius:4px;padding:2px 4px;margin:0 1px;vertical-align:1px;transition:background .12s}
.ref:hover{background:#cfeadb}
.ev{margin-top:10px;display:flex;flex-direction:column;gap:4px}
.ev button{display:grid;grid-template-columns:30px 1fr;gap:6px;text-align:left;padding:6px 8px;border-radius:6px;border:1px solid var(--line);font-size:12.5px;color:var(--ink-2);transition:border-color .12s,background .12s}
.ev button:hover{border-color:#cfe5d9;background:#fbfefc}
.ev .mono{font-size:11px;color:var(--acc);line-height:18px}
.c-facts{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:10px;font-size:11.5px;color:var(--ink-3)}
.c-facts b{font-weight:500;color:var(--ink-2)}
.c-facts .vt{font-family:var(--mono);font-size:11px}
.c-act{display:flex;gap:6px;margin-top:12px}
.c-act .btn{height:26px;font-size:12px;padding:0 9px}
.appeal{margin-top:12px;border:1px solid var(--line-2);border-radius:8px;padding:12px;background:var(--bg-2)}
.appeal label{font-size:11.5px;color:var(--ink-3);display:block;margin-bottom:6px}
.opts{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:10px}
.opts button{height:26px;padding:0 10px;border-radius:6px;border:1px solid var(--line-2);background:#fff;font-size:12px}
.opts button.on{border-color:var(--acc);box-shadow:0 0 0 3px var(--acc-ring);color:var(--acc);font-weight:500}
.appeal textarea{width:100%;height:56px;border:1px solid var(--line-2);border-radius:6px;padding:7px 9px;font:12.5px/1.4 Inter;resize:none;background:#fff}
.appeal textarea:focus{outline:none;border-color:var(--acc);box-shadow:0 0 0 3px var(--acc-ring)}
.appeal-f{display:flex;align-items:center;gap:8px;margin-top:8px}
.appeal-f .delta{font:11.5px var(--mono);color:var(--ink-3)}
.trail{display:flex;align-items:center;gap:6px;margin-top:12px;font-size:12px;flex-wrap:wrap}
.trail .st{display:flex;flex-direction:column;gap:2px;padding:6px 9px;border:1px solid var(--line);border-radius:6px;min-width:84px}
.trail .st span{font-size:10.5px;color:var(--ink-3);text-transform:uppercase;letter-spacing:.04em}
.trail .arr{color:var(--ink-4)}
.trail .st.final{border-color:var(--acc);background:var(--acc-2)}
.s-foot{flex:none;border-top:1px solid var(--line);padding:9px 20px;display:flex;gap:14px;font-size:11.5px;color:var(--ink-3)}
.s-foot .mono{color:var(--ink-2);font-size:11px}

.status{display:flex;align-items:center;gap:16px;padding:0 16px;border-top:1px solid var(--line);font-size:11.5px;color:var(--ink-3);background:var(--bg-2)}
.status span{display:flex;align-items:center;gap:5px}
.status .r{margin-left:auto}
.live-dot{width:6px;height:6px;border-radius:50%;background:var(--yes);box-shadow:0 0 0 3px rgba(21,128,61,.15)}

/* cmdk */
.cmdk-overlay{position:fixed;inset:0;background:rgba(250,250,252,.6);backdrop-filter:blur(3px);display:flex;justify-content:center;padding-top:14vh;z-index:50;opacity:0;transition:opacity .14s}
.cmdk-overlay.is-open{opacity:1}
.cmdk{width:620px;max-height:440px;background:#fff;border-radius:12px;box-shadow:0 0 0 1px var(--line-2),0 24px 64px -12px rgba(16,16,24,.25);display:flex;flex-direction:column;overflow:hidden;transform:scale(.98);transition:transform .14s}
.is-open .cmdk{transform:none}
.cmdk-input{display:flex;align-items:center;gap:10px;padding:0 14px;height:50px;border-bottom:1px solid var(--line);color:var(--ink-3)}
.cmdk-input input{flex:1;border:0;outline:0;font:15px Inter;color:var(--ink)}
.cmdk-list{overflow:auto;padding:6px}
.cmdk-group{font-size:11px;color:var(--ink-3);padding:8px 10px 4px;font-weight:500}
.cmdk-item{display:flex;align-items:center;gap:10px;height:36px;padding:0 10px;border-radius:7px;color:var(--ink-2);cursor:pointer}
.cmdk-item.is-sel{background:var(--bg-3);color:var(--ink)}
.cmdk-item.is-sel .ico{color:var(--acc)}
.cmdk-t{flex:1;display:flex;align-items:center;gap:8px;min-width:0;white-space:nowrap}
.cmdk-sub{color:var(--ink-3);overflow:hidden;text-overflow:ellipsis}
.cmdk-lang{font:600 9.5px var(--mono);color:var(--ink-3);border:1px solid var(--line-2);border-radius:3px;padding:1px 3px}
.cmdk-hint{font:11px var(--mono);color:var(--ink-3)}
.cmdk-foot{display:flex;gap:14px;padding:8px 14px;border-top:1px solid var(--line);font-size:11.5px;color:var(--ink-3);background:var(--bg-2)}
.cmdk-foot span{display:flex;gap:4px;align-items:center}
.cmdk-foot-r{margin-left:auto}
.cmdk-empty{padding:24px;text-align:center;color:var(--ink-3)}
.toast{position:fixed;bottom:44px;left:50%;transform:translate(-50%,8px);background:var(--ink);color:#fff;padding:8px 14px;border-radius:8px;font-size:12.5px;opacity:0;transition:.18s;pointer-events:none;z-index:60}
.toast.is-on{opacity:1;transform:translate(-50%,0)}
::-webkit-scrollbar{width:8px;height:8px}::-webkit-scrollbar-thumb{background:#e4e4e8;border-radius:8px;border:2px solid #fff}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="logo"><div class="logo-mark">QA</div>CQA</div>
    <nav class="crumbs"><span class="sep">/</span><span>Чаты</span><span class="sep">/</span><span>Очередь проверки</span><span class="sep">/</span><b class="mono" id="crumb-id"></b></nav>
    <div class="top-r">
      <button class="search-btn" data-cmdk>
        <svg class="ico" width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="7" cy="7" r="4.5"/><path d="M10.5 10.5l3 3"/></svg>
        <span>Поиск и команды</span><kbd>⌘</kbd><kbd>K</kbd></button>
      <button class="btn" id="btn-prev-v">Сравнить с v1</button>
      <button class="btn btn-pri" id="btn-confirm">Подтвердить <kbd style="background:transparent;border-color:rgba(255,255,255,.35);color:#fff">⌘↵</kbd></button>
      <div class="avatar">АК</div>
    </div>
  </header>

  <main class="main">
    <!-- queue -->
    <section class="pane">
      <div class="pane-h"><h2>Очередь</h2><span class="count" id="q-count"></span>
        <div class="seg" id="seg"><button class="on" data-f="all">Все</button><button data-f="rev">Проверка <span class="n" id="n-rev"></span></button><button data-f="gross">Грубые <span class="n" id="n-gross"></span></button></div>
      </div>
      <div class="queue" id="queue"></div>
      <div class="heat">
        <div class="heat-h"><b>Критерии × язык</b><span>средний балл · <span class="mono">${n}</span></span></div>
        <table id="heat"></table>
      </div>
    </section>

    <!-- transcript -->
    <section class="pane">
      <div class="dlg-h">
        <div class="dlg-title"><h1 class="mono" id="d-id"></h1><span class="lang" id="d-lang"></span>
          <div class="dlg-nav"><kbd>[</kbd><kbd>]</kbd> соседний диалог</div></div>
        <div class="meta" id="d-meta"></div>
      </div>
      <div class="transcript" id="transcript"></div>
    </section>

    <!-- scorecard -->
    <section class="pane">
      <div class="score-h">
        <div class="score-row">
          <div class="score" id="score"></div>
          <div class="flags" id="flags"></div>
          <div class="score-r" id="score-r"></div>
        </div>
        <div class="secs" id="secs"></div>
      </div>
      <div class="crits" id="crits"></div>
      <div class="s-foot" id="s-foot"></div>
    </section>
  </main>

  <footer class="status">
    <span><i class="live-dot"></i>Синхронизировано</span>
    <span><kbd>J</kbd><kbd>K</kbd> критерий</span>

$('#d-meta').innerHTML = `
  <span class="chip">${icon('chat',13)} ${D.channel}</span>
  <span class="chip">${LANG[D.language]}</span>
  <span class="chip"><span class="mono">${T.length}</span> реплик · <span class="mono">${T.filter(t => t.speaker === 'operator').length}</span> оператора</span>
  <span class="chip"><span class="mono">${T[T.length-1].timestamp}</span> длительность</span>
  <span class="chip ok">✓ Первая реакция <span class="mono">${mmss(FIRST_RESP)}</span> ≤ 3:00</span>
  <span class="chip">${D.dataset}</span>`;
$('#transcript').innerHTML = T.map((t, i) => {
  if (t.speaker === 'system') return `<div class="turn sys" data-tidx="${i}"><div class="t-idx">${i}</div><div class="sys-line">${esc(t.text)} · <span class="mono">${t.timestamp}</span></div></div>`
    + `<div class="op-gap"><span class="bar"><i style="width:${FIRST_RESP/180*100}%"></i></span>ожидание оператора <span class="mono">${mmss(FIRST_RESP)}</span> из 3:00</div>`;
  const cls = { client: 'cl', operator: 'op', bot: 'bot' }[t.speaker];
  const cites = (CITED[i] || []).map(c => `<i class="m-${c.status === 'gross' ? 'crit' : c.status}" title="${esc(c.name)}"></i>`).join('');
  return `<div class="turn ${cls}" data-tidx="${i}"><div class="t-idx">${i}</div>
    <div class="t-who"><b>${SPEAKER[t.speaker]}</b><time>${t.timestamp}</time></div>
    <div class="t-text">${turnHTML(i)}</div><div class="t-cites">${cites}</div></div>`;
}).join('');

/* ---------- scorecard ---------- */
$('#score').innerHTML = `${fmt(TOTAL)}<small>/100</small>`;
$('#flags').innerHTML = (GROSS ? `<span class="flag gross">${icon('flag',12)} Грубая ошибка</span>` : '') +
  (REVIEW_N ? `<span class="flag rev">◐ ${REVIEW_N} без консенсуса</span>` : '');
$('#score-r').innerHTML = `чек-лист <span class="mono">v${CL.version}</span><br>v${DATA.prev.version}: <span class="mono">${fmt(DATA.prev.total)}</span> <span style="color:var(--no)">▼ ${fmt(DATA.prev.total - TOTAL)}</span>`;
$('#secs').innerHTML = EV.final_result.sections.map(s => `<div class="sec"><span>${s.name}</span><b>${fmt(s.score,0)}</b>
  <div class="bar"><i style="width:${s.score}%;background:${scoreColor(s.score)}"></i></div></div>`).join('');
$('#s-foot').innerHTML = `<span><span class="mono">${EV.model}</span></span><span>×${EV.samples} прогона</span><span><span class="mono">${fmt(EV.latency_s,1)} с</span></span><span><span class="mono">$${EV.cost_usd.toFixed(3)}</span></span><span style="margin-left:auto">${EV.id}</span>`;
$('#st-r').innerHTML = `Ревьюер · Айгерим К. · <span class="mono">${DATA.stats.evaluated}/${DATA.stats.dialogs}</span> оценено`;

let sel = 2, openId = 'identification', appealOpen = null;
const decisions = {};
function critHTML(c, idx){
  const open = c.id === openId;
  const vt = c.votes.map(v => { const fin = c.a.na ? 'N/A' : c.a.value; return `<i class="${v === fin ? '' : 'x'}"></i>`; }).join('');
  const dec = decisions[c.id];
  const ptsTxt = c.type === 'flag' ? '<small>флаг</small>' : c.a.na ? '<small>—</small>' : `${fmtPts(c.pts)}<small>/${fmtPts(c.eff)}</small>`;
  let body = '';
  if (open) {
    const cr = c.a.checked_range;
    body = `<div class="c-body">
      <p class="c-exp">${linkRefs(c.a.explanation)}</p>
      ${c.a.na_reason ? `<p class="c-exp" style="margin-top:6px;color:var(--na)">N/A: ${esc(c.a.na_reason)}</p>` : ''}
      <div class="ev">${c.a.evidence.map(e => `<button data-goto="${e.turn}"><span class="mono">[${e.turn}]</span><span>«${esc(e.quote)}»</span></button>`).join('')}</div>
      <div class="c-facts">
        <span>Проверено: <button class="ref" data-turn="${cr.from_turn}">${cr.from_turn}</button>–<button class="ref" data-turn="${cr.to_turn}">${cr.to_turn}</button></span>
        <span>Прогоны: <b class="vt">${c.votes.map(v => voteLabel(v, c)).join(' · ')}</b></span>
        <span>Уверенность: <b>${{high:'высокая',medium:'средняя',low:'низкая'}[c.a.confidence]}</b></span>
      </div>
      ${dec ? trailHTML(c, dec) : appealOpen === c.id ? appealHTML(c) :
        `<div class="c-act"><button class="btn" data-act="appeal">${icon('flag',13)} Оспорить <kbd>A</kbd></button><button class="btn" data-act="ok">${icon('check',13)} Согласен</button></div>`}
    </div>`;
  }
  return `<div class="crit${open ? ' open' : ''}${idx === sel ? ' sel' : ''}" data-id="${c.id}">
    <button class="crit-row"><span class="c-n">${c.i}</span>
      <span class="c-name">${c.name}${c.weight ? `<span class="c-w">${c.weight}</span>` : ''}</span>
      <span class="votes${c.review ? ' rev' : ''}" title="Согласие прогонов ${c.agree}/3">${vt}</span>
      <span class="pill p-${dec ? 'part' : c.status}">${dec ? 'Изменено' : c.label}</span>
      <span class="c-pts">${ptsTxt}</span></button>${body}</div>`;
}
function appealHTML(c){
  const d = appealDraft;
  return `<div class="appeal"><label>Решение ревьюера</label>
    <div class="opts">${decisionOptions(c).map(o => `<button data-v="${o.v}" class="${String(d.v) === String(o.v) ? 'on' : ''}">${o.l}</button>`).join('')}</div>
    <label>Обоснование</label><textarea placeholder="Например: «до свидания» без итога — завершение неполное, см. [15]">${esc(d.r)}</textarea>
    <div class="appeal-f"><button class="btn btn-pri" data-act="submit">Сохранить решение</button><button class="btn" data-act="cancel">Отмена</button>
      <span class="delta">${d.v != null ? `итог ${fmt(TOTAL)} → <b style="color:var(--ink)">${fmt(totalWith(c, d.v === 'na' ? 'na' : +d.v))}</b>` : ''}</span></div></div>`;
}
function trailHTML(c, d){
  const lbl = d.v === 'na' ? 'N/A' : voteLabel(+d.v, c);
  return `<div class="trail"><div class="st"><span>ИИ</span>${c.label}</div><span class="arr">→</span>
    <div class="st"><span>Ревьюер</span>${lbl}</div><span class="arr">→</span>
    <div class="st final"><span>Итог</span><b class="mono">${fmt(totalWith(c, d.v === 'na' ? 'na' : +d.v))}</b></div></div>
    <p style="margin-top:8px;font-size:12px;color:var(--ink-3)">«${esc(d.r || 'без комментария')}» — Айгерим К., только что</p>`;
}
let appealDraft = { v: null, r: '' };
function renderCrits(){
  $('#crits').innerHTML = CRITS.map(critHTML).join('');
  const c = CRITS.find(x => x.id === openId);
  $$('.turn').forEach(t => t.classList.toggle('cited-sel', !!c && c.a.evidence.some(e => e.turn === +t.dataset.tidx)));
}
$('#crits').addEventListener('click', e => {
  const cEl = e.target.closest('.crit'); if (!cEl) return;
  const c = CRITS.find(x => x.id === cEl.dataset.id);
  const act = e.target.closest('[data-act]')?.dataset.act;
  const opt = e.target.closest('.opts button');
  if (opt) { appealDraft.v = opt.dataset.v; appealDraft.r = $('textarea', cEl).value; renderCrits(); return; }
  if (act === 'appeal') { appealOpen = c.id; appealDraft = { v: null, r: '' }; renderCrits(); setTimeout(() => $('.appeal textarea')?.focus(), 0); return; }
  if (act === 'cancel') { appealOpen = null; renderCrits(); return; }
  if (act === 'ok') { toast(`«${c.short}» подтверждено`); return; }
  if (act === 'submit') { if (appealDraft.v == null) { toast('Выберите решение'); return; } appealDraft.r = $('textarea', cEl).value; decisions[c.id] = { ...appealDraft }; appealOpen = null; renderCrits(); toast('Решение сохранено · апелляция закрыта'); return; }
  if (e.target.closest('.crit-row')) {
    sel = CRITS.indexOf(c); openId = openId === c.id ? null : c.id; renderCrits();
    if (openId) focusTurn(c.a.evidence[0].turn);
  }
});
renderCrits();
requestAnimationFrame(()=>{const tr=$('#transcript');tr.style.scrollBehavior='auto';tr.scrollTop=$('[data-tidx="1"]').offsetTop-4;tr.style.scrollBehavior='';});

document.addEventListener('keydown', e => {
  if (e.target.matches('input,textarea') || e.metaKey || e.ctrlKey) return;
  const k = e.key.toLowerCase();
  if (k === 'j' || k === 'k') { sel = Math.max(0, Math.min(CRITS.length - 1, sel + (k === 'j' ? 1 : -1))); if (openId) openId = CRITS[sel].id; renderCrits(); if (openId) focusTurn(CRITS[sel].a.evidence[0].turn); $('.crit.sel')?.scrollIntoView({ block: 'nearest' }); }
  if (k === 'enter') { openId = openId === CRITS[sel].id ? null : CRITS[sel].id; renderCrits(); }
  if (k === 'a') { openId = CRITS[sel].id; appealOpen = openId; appealDraft = { v: null, r: '' }; renderCrits(); e.preventDefault(); setTimeout(() => $('.appeal textarea')?.focus(), 0); }
  if (/^[0-9]$/.test(k)) focusTurn(+k);
});
$('#btn-confirm').onclick = () => toast('Оценка подтверждена · следующий: p1-ru-003');
$('#btn-prev-v').onclick = () => toast(`v${DATA.prev.version}: ${fmt(DATA.prev.total)} → v${CL.version}: ${fmt(TOTAL)} · изменились 6 критериев`);
buildPalette();
if (new URLSearchParams(location.search).has('appeal')) { openId = 'closing'; sel = 6; appealOpen = 'closing'; appealDraft = { v: '0', r: 'Итог не подведён, причина ограничения не названа [15]' }; renderCrits(); }
</script>
</body>
</html>
