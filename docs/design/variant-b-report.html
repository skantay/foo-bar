<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CQA Report</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#ffffff; --paper:#fcfcfd; --bg-2:#f7f7f9; --bg-3:#f0f0f4; --line:#ebebf0; --line-2:#dfdfe6;
  --ink:#14141f; --ink-2:#464657; --ink-3:#83839a; --ink-4:#b6b6c6;
  --acc:#4338ca; --acc-2:#eef0ff; --acc-3:#c7cbfb; --acc-ring:rgba(67,56,202,.2);
  --yes:#15803d; --yes-bg:#ecfdf3; --yes-fill:#22a05a; --part:#b45309; --part-bg:#fff6e5; --part-fill:#e9a23b; --no:#dc2626; --no-bg:#fef1f1; --no-fill:#e5484d;
  --na:#2563eb; --na-bg:#eef4ff; --gross:#8f1414; --gross-bg:#fbeaea;
  --serif:'Newsreader',Georgia,serif; --mono:'IBM Plex Mono',ui-monospace,Menlo,monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font:14px/1.55 Inter,system-ui,sans-serif;color:var(--ink);background:var(--bg);font-feature-settings:"tnum","cv11";-webkit-font-smoothing:antialiased;overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
kbd{font:500 10.5px/1 var(--mono);color:var(--ink-3);border:1px solid var(--line-2);border-radius:4px;padding:2px 5px;background:#fff}
.mono{font-family:var(--mono)}
:focus-visible{outline:2px solid var(--acc-ring);outline-offset:2px;border-radius:4px}
.app{display:grid;grid-template-rows:56px 1fr;height:100vh}
.nav{display:flex;align-items:center;gap:20px;padding:0 28px;border-bottom:1px solid var(--line);background:rgba(255,255,255,.9)}
.brand{display:flex;align-items:center;gap:9px;font-weight:600;letter-spacing:-.01em}
.brand i{width:20px;height:20px;border-radius:50%;background:conic-gradient(from 200deg,var(--acc),#818cf8,var(--acc));box-shadow:inset 0 0 0 5px #fff,0 0 0 1px var(--acc-3)}
.tabs{display:flex;gap:2px}
.tabs a{padding:6px 10px;border-radius:6px;color:var(--ink-3);text-decoration:none;font-size:13.5px}
.tabs a.on{color:var(--ink);background:var(--bg-2)}
.tabs a:hover{color:var(--ink)}
.nav-r{margin-left:auto;display:flex;gap:8px;align-items:center}
.btn{white-space:nowrap;height:32px;padding:0 12px;border:1px solid var(--line-2);border-radius:8px;display:inline-flex;align-items:center;gap:7px;font-weight:500;font-size:13px;background:#fff;transition:background .15s,border-color .15s,box-shadow .15s}
.btn:hover{background:var(--bg-2)}
.btn-pri{background:var(--acc);border-color:var(--acc);color:#fff;box-shadow:0 1px 2px rgba(67,56,202,.3)}
.btn-pri:hover{background:#3730a3}
.btn-ghost{border-color:transparent}
.k-btn{color:var(--ink-3);width:250px;justify-content:space-between}
.body{display:grid;grid-template-columns:1fr 432px;min-height:0}
.doc{overflow:auto;scroll-behavior:smooth}
.doc-in{display:grid;grid-template-columns:176px minmax(0,760px);gap:48px;padding:36px 48px 120px 40px}
.toc{position:sticky;top:36px;align-self:start;font-size:12.5px}
.toc h6{font:500 11px Inter;color:var(--ink-3);text-transform:uppercase;letter-spacing:.06em;margin-bottom:10px}
.toc a{display:flex;align-items:center;gap:8px;padding:4px 0;color:var(--ink-2);text-decoration:none;white-space:nowrap}
.toc a:hover{color:var(--acc)}
.toc a .d{width:7px;height:7px;border-radius:50%;flex:none}
.toc a .n{font:11px var(--mono);color:var(--ink-4);width:14px}
.toc hr{border:0;border-top:1px solid var(--line);margin:12px 0}
.toc .rv{margin-left:auto;font-size:10px;color:var(--part)}

.eyebrow{display:flex;gap:10px;align-items:center;color:var(--ink-3);font-size:12.5px}
.eyebrow .sep{width:3px;height:3px;border-radius:50%;background:var(--ink-4)}
.eyebrow .mono{color:var(--ink-2)}
h1{font:500 34px/1.15 var(--serif);letter-spacing:-.015em;margin:12px 0 14px;max-width:24ch}
.lede{font:400 18px/1.55 var(--serif);color:var(--ink-2);max-width:62ch}

.hero{margin-top:28px;border:1px solid var(--line);border-radius:14px;display:grid;grid-template-columns:1.35fr 1fr;overflow:hidden;background:linear-gradient(180deg,#fff,var(--paper))}
.hero-l{padding:22px 24px 20px}
.hero-r{padding:22px 24px 20px;border-left:1px solid var(--line)}
.lbl{font:500 11px Inter;color:var(--ink-3);text-transform:uppercase;letter-spacing:.06em}
.score-line{display:flex;align-items:baseline;gap:10px;margin-top:8px}
.big{font:500 64px/1 var(--serif);letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.big sup{font-size:26px;vertical-align:top;position:relative;top:6px;letter-spacing:0;color:var(--ink-2)}
.of{color:var(--ink-4);font-size:15px}
.after{margin-left:auto;text-align:right;font-size:12.5px;color:var(--ink-3);line-height:1.5}
.after b{display:block;font:500 20px var(--serif);color:var(--acc)}
.wbar{display:flex;gap:3px;height:12px;margin:18px 0 8px}
.wseg{position:relative;border-radius:3px;background:repeating-linear-gradient(135deg,var(--bg-3) 0 3px,#fff 3px 6px);box-shadow:inset 0 0 0 1px var(--line);overflow:hidden;cursor:pointer;transition:transform .15s}
.wseg:hover{transform:scaleY(1.35)}
.wseg i{position:absolute;inset:0 auto 0 0;border-radius:3px}
.wlegend{display:flex;gap:3px;font-size:10.5px;color:var(--ink-3)}
.wlegend span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-family:var(--mono)}
.verdicts{display:flex;flex-wrap:wrap;gap:6px;margin-top:16px}
.vchip{display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 10px;border-radius:999px;font-size:12.5px;font-weight:500;border:1px solid var(--line)}
.vchip.gross{background:var(--gross);color:#fff;border-color:var(--gross)}
.vchip.rev{background:var(--part-bg);color:var(--part);border-color:#f5ddb0}
.vchip.ok{background:var(--yes-bg);color:var(--yes);border-color:#c9ebd6}
.secs{display:flex;flex-direction:column;gap:12px;margin-top:12px}
.sec{display:grid;grid-template-columns:1fr 40px;gap:4px 10px;font-size:12.5px;color:var(--ink-2)}
.sec b{font:500 12.5px var(--mono);text-align:right}
.sec .bar{grid-column:1/-1;height:4px;background:var(--bg-3);border-radius:2px;overflow:hidden}
.sec .bar i{display:block;height:100%;border-radius:2px}
.dist{margin-top:20px;padding-top:16px;border-top:1px solid var(--line)}
.dist-h{display:flex;justify-content:space-between;align-items:baseline}
.dist-h span{font-size:11.5px;color:var(--ink-3)}
.hist{display:flex;align-items:flex-end;gap:4px;height:64px;margin-top:22px;position:relative}
.hist i{flex:1;background:#dcdffb;border-radius:3px 3px 0 0;min-height:3px;position:relative}
.hist i.me{background:var(--acc)}
.hist i.me::after{content:"этот";position:absolute;top:-17px;left:50%;transform:translateX(-50%);font:500 10px Inter;color:var(--acc)}
.hist-x{display:flex;justify-content:space-between;font:10px var(--mono);color:var(--ink-4);margin-top:4px}
.meta-row{display:flex;gap:14px;margin-top:16px;font-size:11.5px;white-space:nowrap;color:var(--ink-3);flex-wrap:wrap}
.meta-row .mono{color:var(--ink-2);font-size:11.5px}

h2{font:500 24px/1.2 var(--serif);letter-spacing:-.01em;display:flex;align-items:baseline;gap:12px;margin:52px 0 6px}
h2 .sc{font:500 13px var(--mono);color:var(--ink-3)}
.h2-sub{color:var(--ink-3);font-size:13px;margin-bottom:8px}
.item{display:grid;grid-template-columns:44px 1fr;gap:0 4px;padding:22px 0;border-top:1px solid var(--line);scroll-margin-top:20px}
.item-n{font:400 26px/1 var(--serif);color:var(--ink-4);padding-top:2px}
.item-h{display:flex;align-items:center;gap:10px}
.item-h h3{font:600 15.5px Inter;letter-spacing:-.01em}
.item-h .w{font:11.5px var(--mono);color:var(--ink-4)}
.item-h .r{margin-left:auto;display:flex;align-items:center;gap:10px}
.pill{display:inline-flex;align-items:center;height:24px;padding:0 9px;border-radius:6px;font-size:12.5px;font-weight:500;white-space:nowrap}
.p-yes{background:var(--yes-bg);color:var(--yes)} .p-no{background:var(--no-bg);color:var(--no)} .p-part{background:var(--part-bg);color:var(--part)} .p-na{background:var(--na-bg);color:var(--na)} .p-gross{background:var(--gross);color:#fff} .p-ok{background:var(--bg-3);color:var(--ink-3)}
.pts{font:500 13px var(--mono);min-width:54px;text-align:right}
.pts small{color:var(--ink-4)}
.item p.exp{margin-top:8px;color:var(--ink-2);max-width:64ch}
.ref{font:500 11px/1 var(--mono);color:var(--acc);background:var(--acc-2);border-radius:4px;padding:3px 5px;vertical-align:1px;transition:background .12s}
.ref:hover{background:var(--acc-3)}
.quotes{margin-top:12px;display:flex;flex-direction:column;gap:8px}
.q{display:grid;grid-template-columns:auto 1fr;gap:12px;text-align:left;padding:2px 0 2px 14px;border-left:2px solid var(--acc-3);transition:border-color .15s}
.q:hover{border-left-color:var(--acc)}
.q blockquote{font:italic 400 16px/1.45 var(--serif);color:var(--ink)}
.q .who{font:11px var(--mono);color:var(--ink-3);padding-top:3px;white-space:nowrap}
.foot{display:flex;flex-wrap:wrap;align-items:center;gap:6px 16px;margin-top:14px;font-size:12px;color:var(--ink-3)}
.cons{display:inline-flex;gap:3px;vertical-align:-1px;margin-right:4px}
.cons i{width:8px;height:8px;border-radius:50%;background:var(--ink-2)}
.cons i.x{background:#fff;box-shadow:inset 0 0 0 1.5px var(--part)}
.cons.rev i:not(.x){background:var(--part)}
.foot .rv{color:var(--part);font-weight:500}
.linkbtn{margin-left:auto;color:var(--acc);font-weight:500;display:inline-flex;gap:6px;align-items:center;padding:4px 8px;border-radius:6px;transition:background .12s}
.linkbtn:hover{background:var(--acc-2)}
.na-note{margin-top:8px;font-size:13px;color:var(--na);background:var(--na-bg);padding:8px 12px;border-radius:8px;max-width:64ch}
.appeal{margin-top:14px;border:1px solid var(--acc-3);border-radius:12px;padding:16px;background:linear-gradient(180deg,#fafaff,#fff);box-shadow:0 8px 24px -12px rgba(67,56,202,.25);animation:in .18s ease}
@keyframes in{from{opacity:0;transform:translateY(-4px)}}
.appeal .lbl{display:block;margin-bottom:8px}
.opts{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.opts button{height:30px;padding:0 12px;border-radius:8px;border:1px solid var(--line-2);background:#fff;font-size:13px}
.opts button.on{border-color:var(--acc);color:var(--acc);box-shadow:0 0 0 3px var(--acc-ring);font-weight:500}
.appeal textarea{width:100%;height:64px;border:1px solid var(--line-2);border-radius:8px;padding:8px 10px;font:13.5px/1.45 Inter;resize:none}
.appeal textarea:focus{outline:0;border-color:var(--acc);box-shadow:0 0 0 3px var(--acc-ring)}
.appeal-f{display:flex;gap:8px;align-items:center;margin-top:10px}
.appeal-f .delta{margin-left:auto;font:12.5px var(--mono);color:var(--ink-3)}
.trail{display:flex;align-items:stretch;gap:0;margin-top:14px;border:1px solid var(--line);border-radius:10px;overflow:hidden;max-width:520px}
.trail div{flex:1;padding:9px 14px;font-size:13px;position:relative}
.trail div+div{border-left:1px solid var(--line)}
.trail span{display:block;font:500 10.5px Inter;color:var(--ink-3);text-transform:uppercase;letter-spacing:.06em;margin-bottom:2px}
.trail .fin{background:var(--acc-2)}
.trail .fin b{color:var(--acc)}
.trail-note{font-size:12.5px;color:var(--ink-3);margin-top:8px;font-style:italic;font-family:var(--serif);font-size:14.5px}

.cmp{width:100%;border-collapse:collapse;margin-top:14px;font-size:13px}
.cmp th{font:500 11px Inter;color:var(--ink-3);text-transform:uppercase;letter-spacing:.05em;text-align:left;padding:8px 10px;border-bottom:1px solid var(--line-2)}
.cmp td{padding:9px 10px;border-bottom:1px solid var(--line)}
.cmp td.v{font-family:var(--mono);font-size:12.5px}
.cmp tr.chg td.v.cur{font-weight:500}
.cmp .tag{font:10.5px Inter;color:var(--acc);background:var(--acc-2);border-radius:4px;padding:1px 5px;margin-left:6px}
.cmp tfoot td{font-weight:600;border-bottom:0}
.dv{display:inline-flex;align-items:center;gap:6px}
.dv i{width:7px;height:7px;border-radius:50%}

/* drawer */
.drawer{border-left:1px solid var(--line);background:var(--paper);display:flex;flex-direction:column;min-height:0}
.dr-h{flex:none;padding:16px 20px 14px;border-bottom:1px solid var(--line)}
.dr-h .t{display:flex;align-items:center;gap:8px;font-weight:600}
.dr-h .t .x{margin-left:auto;color:var(--ink-3);width:26px;height:26px;border-radius:6px;display:grid;place-items:center}
.dr-h .t .x:hover{background:var(--bg-3)}
.dr-sub{display:flex;gap:12px;margin-top:6px;font-size:12px;color:var(--ink-3)}
.dr-sub .ok{color:var(--yes)}
.chat{flex:1;overflow:auto;padding:16px 20px 160px;display:flex;flex-direction:column;gap:10px;scroll-behavior:smooth;position:relative}
.turn{display:flex;flex-direction:column;max-width:86%;transition:transform .2s}
.turn .who{font-size:11px;color:var(--ink-3);display:flex;gap:6px;margin-bottom:3px;padding:0 4px}
.turn .who .mono{color:var(--ink-4)}
.bub{padding:9px 12px;border-radius:12px;font-size:13.5px;line-height:1.45;background:#fff;border:1px solid var(--line);transition:box-shadow .25s,border-color .25s}
.turn.client{align-self:flex-start}
.turn.client .bub{border-top-left-radius:4px}
.turn.operator{align-self:flex-end;align-items:flex-end}
.turn.operator .bub{background:var(--acc-2);border-color:#dfe2fd;border-top-right-radius:4px}
.turn.bot{align-self:flex-start;opacity:.78}
.turn.bot .bub{background:transparent;border-style:dashed;font-size:12.5px;color:var(--ink-2)}
.turn.system{align-self:center;font-size:11.5px;color:var(--ink-3);padding:4px 0}
.turn.system .bub{border:0;background:var(--bg-3);border-radius:999px;padding:4px 12px;font-size:11.5px}
.tags{display:flex;gap:3px;margin-top:4px;padding:0 4px}
.tags span{font:500 10px/1 var(--mono);padding:3px 5px;border-radius:4px}
.t-yes{background:var(--yes-bg);color:var(--yes)} .t-no{background:var(--no-bg);color:var(--no)} .t-part{background:var(--part-bg);color:var(--part)} .t-na{background:var(--na-bg);color:var(--na)} .t-gross{background:var(--gross);color:#fff}
mark{background:transparent;color:inherit;border-radius:2px;padding:0 1px;transition:background .2s}
.turn.hl mark,.turn.is-focus mark{background:rgba(250,204,21,.35)}
.turn.hl .bub{border-color:var(--acc-3)}
.turn.is-focus .bub{box-shadow:0 0 0 3px var(--acc-ring),0 8px 20px -8px rgba(67,56,202,.35);border-color:var(--acc)}
.turn.is-focus{animation:nudge .5s ease}
@keyframes nudge{30%{transform:translateY(-2px)}}
.gap{align-self:center;font-size:11px;color:var(--yes);display:flex;gap:6px;align-items:center}

/* cmdk */
.cmdk-overlay{position:fixed;inset:0;background:rgba(20,20,40,.18);display:flex;justify-content:center;padding-top:15vh;z-index:50;opacity:0;transition:opacity .15s}
.cmdk-overlay.is-open{opacity:1}
.cmdk{width:600px;max-height:460px;background:#fff;border-radius:14px;box-shadow:0 0 0 1px rgba(20,20,40,.06),0 30px 80px -20px rgba(30,27,75,.4);display:flex;flex-direction:column;overflow:hidden;transform:translateY(-6px);transition:transform .15s}
.is-open .cmdk{transform:none}
.cmdk-input{display:flex;align-items:center;gap:10px;padding:0 16px;height:54px;border-bottom:1px solid var(--line);color:var(--acc)}
.cmdk-input input{flex:1;border:0;outline:0;font:16px Inter;color:var(--ink)}
.cmdk-list{overflow:auto;padding:6px}
.cmdk-group{font:500 11px Inter;color:var(--ink-3);padding:10px 12px 4px;text-transform:uppercase;letter-spacing:.06em}
.cmdk-item{display:flex;align-items:center;gap:12px;height:40px;padding:0 12px;border-radius:9px;color:var(--ink-2);cursor:pointer}
.cmdk-item.is-sel{background:var(--acc-2);color:var(--acc)}
.cmdk-t{flex:1;display:flex;gap:8px;align-items:center;min-width:0;white-space:nowrap}
.cmdk-sub{color:var(--ink-3);overflow:hidden;text-overflow:ellipsis}
.cmdk-lang{font:500 10px var(--mono);color:var(--ink-3)}
.cmdk-hint{font:11.5px var(--mono);color:var(--ink-3)}
.cmdk-foot{display:flex;gap:16px;padding:9px 16px;border-top:1px solid var(--line);font-size:12px;color:var(--ink-3)}
.cmdk-foot span{display:flex;gap:4px;align-items:center}
.cmdk-foot-r{margin-left:auto}
.cmdk-empty{padding:28px;text-align:center;color:var(--ink-3)}
.toast{position:fixed;bottom:24px;left:calc(50% - 216px);transform:translate(-50%,8px);background:var(--ink);color:#fff;padding:9px 16px;border-radius:10px;font-size:13px;opacity:0;transition:.18s;pointer-events:none;z-index:60}
.toast.is-on{opacity:1;transform:translate(-50%,0)}
::-webkit-scrollbar{width:8px}::-webkit-scrollbar-thumb{background:#e3e3ea;border-radius:8px;border:2px solid #fff}
</style>
</head>
<body>
<div class="app">
  <header class="nav">
    <div class="brand"><i></i>CQA</div>
    <nav class="tabs"><a href="#" class="on">Отчёты</a><a href="#">Апелляции</a><a href="#">Аналитика</a><a href="#">Чек-листы</a></nav>
    <div class="nav-r">
      <button class="btn k-btn" data-cmdk><span>Найти или выполнить…</span><span><kbd>⌘</kbd> <kbd>K</kbd></span></button>
      <button class="btn" id="tgl">Расшифровка</button>
      <button class="btn btn-pri" id="ok">Утвердить отчёт</button>
    </div>
  </header>
  <div class="body" id="body">
    <main class="doc" id="doc">
      <div class="doc-in">
        <aside class="toc" id="toc"></aside>
        <article id="art"></article>
      </div>
    </main>
    <aside class="drawer" id="drawer">
      <div class="dr-h">
        <div class="t">Расшифровка диалога <span class="mono" style="font-weight:400;color:var(--ink-3);font-size:12px" id="dr-id"></span><button class="x" id="x" aria-label="Скрыть">✕</button></div>
        <div class="dr-sub" id="dr-sub"></div>
      </div>
      <div class="chat" id="chat"></div>
    </aside>
  </div>

<script>

      <div class="quotes">${c.a.evidence.map(e => `<button class="q" data-goto="${e.turn}"><span class="who">[${e.turn}] ${SPEAKER[e.speaker] || ''}<br>${e.timestamp || ''}</span><blockquote>«${esc(e.quote)}»</blockquote></button>`).join('')}</div>
      <div class="foot">
        <span>${cons}${c.agree}/3 прогона согласны${c.review ? ' · <span class="rv">нужна проверка</span>' : ''}</span>
        <span>Проверено: реплики <button class="ref" data-turn="${cr.from_turn}">${cr.from_turn}</button>–<button class="ref" data-turn="${cr.to_turn}">${cr.to_turn}</button></span>
        <span>Голоса: <span class="mono">${c.votes.map(v => voteLabel(v, c)).join(' / ')}</span></span>
        ${dec || appealOpen === c.id ? '' : `<button class="linkbtn" data-appeal="${c.id}">Оспорить →</button>`}
      </div>
      ${appealOpen === c.id ? appealHTML(c) : ''}
      ${dec ? trailHTML(c, dec) : ''}
    </div></section>`;
}
function appealHTML(c){
  return `<div class="appeal" data-c="${c.id}"><span class="lbl">Решение ревьюера</span>
    <div class="opts">${decisionOptions(c).map(o => `<button data-v="${o.v}" class="${String(draft.v) === String(o.v) ? 'on' : ''}">${o.l}</button>`).join('')}</div>
    <textarea placeholder="Обоснование: что увидели в диалоге, со ссылкой на реплику">${esc(draft.r)}</textarea>
    <div class="appeal-f"><button class="btn btn-pri" data-act="save">Сохранить решение</button><button class="btn btn-ghost" data-act="cancel">Отмена</button>
    <span class="delta">${draft.v != null ? `итог ${fmt(finalTotal())} → <b style="color:var(--acc)">${fmt(finalTotal() + totalWith(c, draft.v === 'na' ? 'na' : +draft.v) - TOTAL)}</b>` : 'выберите решение'}</span></div></div>`;
}
function trailHTML(c, d){
  const l = d.v === 'na' ? 'N/A' : voteLabel(+d.v, c);
  return `<div class="trail"><div><span>Оценка ИИ</span>${c.label} · ${fmtPts(c.pts)} б.</div><div><span>Ревьюер</span>${l}</div><div class="fin"><span>Итог кейса</span><b class="mono">${fmt(finalTotal())}</b></div></div>
  <p class="trail-note">«${esc(d.r)}» — ${d.who}, ${d.when}${d.demo ? ' · демо' : ''}</p>`;
}

function render(){
  const ft = finalTotal();
  const bins = DATA.stats.distribution; const mx = Math.max(...bins); const myBin = Math.min(9, Math.floor(TOTAL / 10));
  const gross = CRITS.find(c => c.id === 'gross_errors');
  const bySec = id => CRITS.filter(c => c.section === id);
  const secNames = { start: 'Начало и понимание запроса', solve: 'Безопасность и решение', lead: 'Ведение и завершение диалога', gross: 'Грубые нарушения' };
  const secScore = id => EV.final_result.sections.find(s => s.id === id)?.score;
  const segs = CRITS.filter(c => c.type !== 'flag' && !c.a.na);
  $('#art').innerHTML = `
  <div id="top" class="eyebrow"><span class="mono">${D.id}</span><span class="sep"></span><span>${D.channel}</span><span class="sep"></span><span>${LANG[D.language]}</span><span class="sep"></span><span>${T.length} реплик</span><span class="sep"></span><span>${CL.name} · v${CL.version}</span></div>
  <h1>Оператор раскрыл состояние счёта до&nbsp;проверки личности</h1>
  <p class="lede">${esc(EV.summary)}</p>

  <div class="hero">
    <div class="hero-l">
      <span class="lbl">Итоговый балл</span>
      <div class="score-line"><span class="big">${Math.floor(TOTAL)}<sup>,${fmt(TOTAL).split(',')[1]}</sup></span><span class="of">из 100</span>
        <div class="after">после ревью<b class="mono">${fmt(ft)}</b></div></div>
      <div class="wbar">${segs.map(c => `<div class="wseg" style="flex:${c.eff}" title="${esc(c.name)}: ${fmtPts(c.pts)} из ${fmtPts(c.eff)}" data-jump="${c.id}"><i style="width:${(c.r.ratio * 100)}%;background:${colorOf(c.status)}"></i></div>`).join('')}</div>
      <div class="wlegend">${segs.map(c => `<span style="flex:${c.eff}">${String(c.i).padStart(2,'0')}</span>`).join('')}</div>
      <div class="verdicts">
        ${GROSS ? `<span class="vchip gross">● Грубая ошибка · раскрытие данных</span>` : ''}
        ${REVIEW_N ? `<span class="vchip rev">◐ ${REVIEW_N} критерия без консенсуса</span>` : ''}
        <span class="vchip ok">Первая реакция ${mmss(FIRST_RESP)} — в пределах 3:00</span>
      </div>
      <div class="meta-row"><span>Модель <span class="mono">${EV.model}</span></span><span>×${EV.samples} прогона</span><span><span class="mono">${fmt(EV.latency_s,1)} с</span></span><span><span class="mono">$${EV.cost_usd.toFixed(3)}</span></span></div>
    </div>
    <div class="hero-r">
      <span class="lbl">По разделам</span>
      <div class="secs">${EV.final_result.sections.map(s => `<div class="sec"><span>${s.name}</span><b>${fmt(s.score,0)}</b><div class="bar"><i style="width:${s.score}%;background:${scoreCol(s.score)}"></i></div></div>`).join('')}</div>
      <div class="dist"><div class="dist-h"><span class="lbl">Среди ${DATA.stats.evaluated} диалогов</span><span>среднее <b class="mono" style="color:var(--ink)">${fmt(DATA.stats.avg_total,1)}</b></span></div>
        <div class="hist">${bins.map((b, i) => `<i class="${i === myBin ? 'me' : ''}" style="height:${Math.max(6, Math.sqrt(b / mx) * 100)}%" title="${i*10}–${i*10+10}: ${b}"></i>`).join('')}</div>
        <div class="hist-x"><span>0</span><span>50</span><span>100</span></div></div>
    </div>
  </div>

  ${['start','solve','lead','gross'].map(s => `<h2>${secNames[s]}${secScore(s) != null ? `<span class="sc">${fmt(secScore(s),0)} / 100</span>` : ''}</h2>${bySec(s).map(critItem).join('')}`).join('')}

  <h2 id="cmp">Версии и решения</h2>
  <p class="h2-sub">Одна и та же переписка: оценка ИИ на прошлой версии чек-листа, текущая оценка и решение ревьюера.</p>
  <table class="cmp"><thead><tr><th>Критерий</th><th>Чек-лист v${DATA.prev.version}</th><th>Чек-лист v${CL.version} · ИИ</th><th>Ревьюер</th><th>Итог</th></tr></thead>
  <tbody>${CRITS.map(c => {
    const p = c.prev; const pl = p.na ? 'N/A' : voteLabel(p.value, c); const cl = c.a.na ? 'N/A' : voteLabel(c.a.value, c);
    const d = decisions[c.id]; const dl = d ? (d.v === 'na' ? 'N/A' : voteLabel(+d.v, c)) : '—';
    const chg = pl !== cl;
    return `<tr class="${chg ? 'chg' : ''}"><td>${c.short}</td><td class="v" style="color:var(--ink-3)">${pl}</td><td class="v cur"><span class="dv"><i style="background:${colorOf(c.status)}"></i>${cl}</span>${chg ? '<span class="tag">изменилось</span>' : ''}</td><td class="v">${dl}</td><td class="v"><b>${d ? dl : cl}</b></td></tr>`; }).join('')}</tbody>
  <tfoot><tr><td>Итог</td><td class="v" style="color:var(--ink-3)">${fmt(DATA.prev.total)}</td><td class="v">${fmt(TOTAL)}</td><td class="v">${Object.keys(decisions).length} изм.</td><td class="v" style="color:var(--acc)">${fmt(ft)}</td></tr></tfoot></table>`;
}

function renderChat(){
  $('#dr-id').textContent = D.id;
  $('#dr-sub').innerHTML = `<span>${T.filter(t=>t.speaker==='operator').length} реплики оператора</span><span>${T[T.length-1].timestamp}</span><span class="ok">● ответ через ${mmss(FIRST_RESP)}</span>`;
  $('#chat').innerHTML = T.map((t, i) => {
    const tags = (CITED[i] || []).map(c => `<span class="t-${c.status === 'ok' ? 'na' : c.status}" title="${esc(c.name)}">${c.i}</span>`).join('');
    const gap = t.speaker === 'system' ? `<div class="gap">⏱ оператор подключился через ${mmss(FIRST_RESP)}</div>` : '';
    return `<div class="turn ${t.speaker}" data-tidx="${i}">${t.speaker !== 'system' ? `<div class="who">${SPEAKER[t.speaker]} <span class="mono">[${i}] · ${t.timestamp}</span></div>` : ''}
      <div class="bub">${t.speaker === 'system' ? esc(t.text) + ' · ' + t.timestamp : turnHTML(i)}</div>${tags ? `<div class="tags">${tags}</div>` : ''}</div>${gap}`;
  }).join('');
}

renderTOC(); render(); renderChat();
requestAnimationFrame(() => { const ch = $('#chat'); ch.style.scrollBehavior = 'auto'; ch.scrollTop = $('[data-tidx="8"]').offsetTop - 16; ch.style.scrollBehavior = ''; });

$('#art').addEventListener('mouseover', e => { const it = e.target.closest('.item'); const id = it?.id.slice(2); if (id === hov) return; hov = id;
  const c = CRITS.find(x => x.id === id); $$('.turn').forEach(t => t.classList.toggle('hl', !!c && c.a.evidence.some(ev => ev.turn === +t.dataset.tidx))); });
let hov = null;
$('#art').addEventListener('click', e => {
  const ap = e.target.closest('[data-appeal]'); const opt = e.target.closest('.opts button'); const act = e.target.closest('[data-act]')?.dataset.act;
  const jump = e.target.closest('[data-jump]');
  if (jump) { $('#c-' + jump.dataset.jump).scrollIntoView({ behavior: 'smooth', block: 'start' }); return; }
  if (ap) { appealOpen = ap.dataset.appeal; draft = { v: null, r: '' }; render(); setTimeout(() => $('.appeal textarea')?.focus({ preventScroll: true }), 0); return; }
  if (opt) { draft.r = $('.appeal textarea').value; draft.v = opt.dataset.v; render(); return; }
  if (act === 'cancel') { appealOpen = null; render(); }
  if (act === 'save') { if (draft.v == null) return toast('Выберите решение'); draft.r = $('.appeal textarea').value || 'Без комментария'; decisions[appealOpen] = { v: draft.v === 'na' ? 'na' : +draft.v, r: draft.r, who: 'Вы', when: 'только что' }; appealOpen = null; render(); toast('Решение сохранено'); }
});
let open = true;
const setDrawer = v => { open = v; $('#body').style.gridTemplateColumns = v ? '1fr 432px' : '1fr 0'; $('#drawer').style.visibility = v ? '' : 'hidden'; };
$('#tgl').onclick = () => setDrawer(!open); $('#x').onclick = () => setDrawer(false);
function onTurnFocus(){ if (!open) setDrawer(true); }
$('#ok').onclick = () => toast(`Отчёт утверждён · итог ${fmt(finalTotal())}`);
buildPalette();
const qp = new URLSearchParams(location.search);
if (qp.has('appeal')) { appealOpen = 'consultation'; draft = { v: '15', r: 'Причина названа (ограничение), следующий шаг дан — ставлю 15 [11], [15]' }; render(); setTimeout(() => { $('#doc').style.scrollBehavior='auto'; $('#c-consultation').scrollIntoView(); }, 50); }
if (qp.has('cmp')) setTimeout(() => { $('#doc').style.scrollBehavior='auto'; $('#cmp').scrollIntoView(); }, 50);
</script>
</body>
</html>
